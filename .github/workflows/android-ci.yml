name: AURA Android build and unit verification
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - "AGENTS.md"
      - "README.md"
      - "docs/ANDROID_HANDOFF.md"
      - "docs/CONSTRAINTS.md"
      - "docs/ENGINE_CONTRACT.md"
      - "docs/ENGINE_IMPLEMENTATION_STATE.md"
      - "docs/MATRIZ_DE_TESTES.md"
      - "docs/TRACEABILITY.md"
      - "docs/design/**"
      - "docs/superpowers/plans/**"
      - "scripts/check_design_coverage.py"
      - "scripts/test_design_coverage.py"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - "AGENTS.md"
      - "README.md"
      - "docs/ANDROID_HANDOFF.md"
      - "docs/CONSTRAINTS.md"
      - "docs/ENGINE_CONTRACT.md"
      - "docs/ENGINE_IMPLEMENTATION_STATE.md"
      - "docs/MATRIZ_DE_TESTES.md"
      - "docs/TRACEABILITY.md"
      - "docs/design/**"
      - "docs/superpowers/plans/**"
      - "scripts/check_design_coverage.py"
      - "scripts/test_design_coverage.py"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile app, test contracts and package debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Keep JUnit results on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-android-junit
          path: android/app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Check release readiness without hiding missing evidence
        id: release_coverage
        run: |
          if python3 scripts/check_design_coverage.py --release; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK retido. Os 66 requisitos e as provas fisicas continuam pendentes."
          fi
      - name: Upload debug APK for remote installation
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_coverage.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
