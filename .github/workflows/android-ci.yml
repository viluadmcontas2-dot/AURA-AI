name: AURA Android build and unit verification
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Locate Android SDK command-line tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n1)"
          test -x "$BIN/sdkmanager"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Accept available Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          exit ${PIPESTATUS[1]}
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile app, test contracts and package debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK for remote installation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
