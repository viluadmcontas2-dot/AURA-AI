name: Engine contract CI
on:
  push:
    paths: ["android/**", "docs/design/**", ".github/workflows/android-ci.yml", "scripts/check_design_coverage.py", "scripts/test_design_coverage.py", "engine/**", ".github/workflows/engine-ci.yml", "AGENTS.md", "README.md", "docs/ENGINE_CONTRACT.md", "docs/CONSTRAINTS.md", "docs/ENGINE_IMPLEMENTATION_STATE.md", "docs/TRACEABILITY.md", "docs/MATRIZ_DE_TESTES.md", "docs/superpowers/plans/**"]
  pull_request:
    paths: ["android/**", "docs/design/**", ".github/workflows/android-ci.yml", "scripts/check_design_coverage.py", "scripts/test_design_coverage.py", "engine/**", ".github/workflows/engine-ci.yml", "AGENTS.md", "README.md", "docs/ENGINE_CONTRACT.md", "docs/CONSTRAINTS.md", "docs/ENGINE_IMPLEMENTATION_STATE.md", "docs/TRACEABILITY.md", "docs/MATRIZ_DE_TESTES.md", "docs/superpowers/plans/**"]
permissions:
  contents: read
jobs:
  engine-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q engine
      - name: Contract tests
        working-directory: engine
        run: python -m unittest discover -s tests -v
